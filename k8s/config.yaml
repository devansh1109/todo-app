#Defines the foundational config resources for the app
#Namespace is important as it will seperate our todo app from any other app that might be present in the Cluster
---            
apiVersion: v1
kind: Namespace
metadata:
  name: todo-app  #Namespace identifier for the app

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  namespace: todo-app
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "todo_db"

---
#This is to initialise the creation of our postgres database and table on startup
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: todo-app
data:
  init.sql: |
    -- Users table
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        email VARCHAR(255) UNIQUE NOT NULL,
        password VARCHAR(255) NOT NULL,
        name VARCHAR(255),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Todos table with user_id foreign key
    CREATE TABLE IF NOT EXISTS todos (
        id SERIAL PRIMARY KEY,
        user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        title VARCHAR(255) NOT NULL,
        description TEXT,
        completed BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create indexes for faster queries
    CREATE INDEX IF NOT EXISTS idx_todos_user_id ON todos(user_id);
    CREATE INDEX IF NOT EXISTS idx_todos_completed ON todos(completed);
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);

---

#Do not hardcode the sensitive data in the configmap under secret.
#Future scope can be to user kubernetes secret or external secret manager so these do not show up on version control
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo-app
type: Opaque #Secret type used for key-value pairs
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"
  JWT_SECRET: "L4ncBIfGALPwbqYkWTNxq7PpmYjN1eihDUevziwUBPJ"
