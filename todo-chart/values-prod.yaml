namespace: todo-prod

postgres:
  replicas: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

backend:
  replicas: 5
  autoscaling:
    minReplicas: 5
    maxReplicas: 20
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

frontend:
  replicas: 3
  service:
    nodePort: 30002
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
